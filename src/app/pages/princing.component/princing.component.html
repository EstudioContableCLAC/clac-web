<!-- Page Header -->
<section class="page-header">
    <div class="container">
      <h1>Pricing &amp; Plans</h1>
      <p>Simple, transparent pricing for every stage of growth.</p>
    </div>
  </section>
  
  <!-- Pricing Cards -->
  <section class="pricing-area pricing-fourteen">
    <app-section-title
      badge="Pricing"
      title="Pricing &amp; Plans"
      subtitle="There are many variations of passages of Lorem Ipsum available, but the majority have suffered alteration in some form.">
    </app-section-title>
    <div class="container">
      <div class="row justify-content-center">
        @for (plan of plans; track plan.name) {
          <div class="col-lg-4 col-md-6 col-12">
            <app-pricing-card [plan]="plan"></app-pricing-card>
          </div>
        }
      </div>
    </div>
  </section>
  
  <!-- FAQ teaser -->
  <section class="call-action">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-8 col-md-10">
          <div class="inner-content">
            <h2>Not sure which plan is right for you?</h2>
            <p>Our team is happy to help you find the perfect solution for your business needs.</p>
            <div class="light-rounded-buttons">
              <a routerLink="/contact" class="btn primary-btn-outline">Talk to Us</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
